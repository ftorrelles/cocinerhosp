<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CocinerHosp — Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F4F3EF;
      color: #1A1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #1B5E3F;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #6B6860;
      margin-bottom: 24px;
      max-width: 280px;
      line-height: 1.4;
    }
    .btn {
      background: #1B5E3F;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="icon">CH</div>
  <h1>Sin conexión</h1>
  <p>
    Sin conexión — los cálculos siguen disponibles.<br />
    Solo la calculadora de producción funciona sin internet.
  </p>
  <button class="btn" onclick="window.location.href = '/'">
    Reintentar
  </button>
</body>
</html>
